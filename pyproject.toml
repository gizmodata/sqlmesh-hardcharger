[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlmesh-hardcharger"
version = "1.0.0"
description = "Hardcharger engine adapter for SQLMesh"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Philip Moore", email = "philip@gizmodata.com" }]
keywords = ["sqlmesh", "hardcharger", "duckdb", "arrow", "warp-sql", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "sqlmesh>=0.236.4,<0.237",
    "adbc-driver-hardcharger>=2.0.2,<3",
]

[project.scripts]
sqlmesh-hardcharger = "sqlmesh_hardcharger.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "ruff>=0.17.2",
    "hardcharger>=2.0.1",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "build>=1.6.1",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/gizmodata/sqlmesh-hardcharger"
Repository = "https://github.com/gizmodata/sqlmesh-hardcharger"
Documentation = "https://github.com/gizmodata/sqlmesh-hardcharger#readme"

[tool.setuptools.packages.find]
include = ["sqlmesh_hardcharger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: marks tests as integration tests",
    "ducklake: marks tests that require DuckLake extension and PostgreSQL",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
